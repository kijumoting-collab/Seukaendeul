.sticky-ad{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px;
    background:rgba(3,7,18,.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.08);
    animation:slideUp .35s ease-out;
}

@keyframes slideUp{
    from{
        transform:translateY(100%);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.close-ad{
    position:absolute;
    top:-12px;
    right:12px;
    width:24px;
    height:24px;
    border:none;
    border-radius:50%;
    background:#1e293b;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    transition:.2s;
}

.close-ad:hover{
    background:#334155;
    transform:scale(1.05);
}

.ad-728x90{
    width:min(728px, calc(100vw - 16px));

    background:rgba(15,23,42,.4);
    border:1px dashed rgba(255,255,255,.1);

    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:13px;
    text-align:center;
    overflow:hidden;
}

            handleRoute();
        }

        function handleRoute() {
            const pathSegments = window.location.pathname.replace(/^\/+/, "").split("/");
            const cleanSegments = pathSegments.filter(seg => seg !== "" && seg !== "index.html");

            if (cleanSegments.length === 0) {
                document.getElementById("catalogView").style.display = "block";
                document.getElementById("detailView").style.display = "none";
                document.getElementById("headerNav").innerHTML = "";
                currentTvId = null;
            } else {
                currentTvId = cleanSegments[0];
                if (!database[currentTvId]) {
                    router("/"); 
                    return;
                }

                document.getElementById("catalogView").style.display = "none";
                document.getElementById("detailView").style.display = "block";
                document.getElementById("headerNav").innerHTML = `<button class="back-home" onclick="router('/')">${langText.back}</button>`;

                const tvObj = database[currentTvId];

                currentSeasonNum = null;
                if (cleanSegments[1]) {
                    const matchSeason = cleanSegments[1].match(/season-?(\d+)/i);
                    currentSeasonNum = matchSeason ? matchSeason[1] : cleanSegments[1];
                }

                currentEpisodeNum = null;
                if (cleanSegments[2]) {
                    const matchEp = cleanSegments[2].match(/(?:ep|episode-?)-?(\d+)/i);
                    currentEpisodeNum = matchEp ? matchEp[1] : cleanSegments[2];
                }

                initPlayerPage(tvObj, currentSeasonNum, currentEpisodeNum);
            }
        }

        function initPlayerPage(tvObj, seasonNum, episodeNum) {
            const seasonSelect = document.getElementById("seasonSelect");
            seasonSelect.innerHTML = `<option value="">${langText.select_season}</option>`;
            
            tvObj.seasons.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.season_number;
                opt.textContent = s.name || (langText.season_prefix + ' ' + s.season_number);
                if (seasonNum && s.season_number == seasonNum) {
                    opt.selected = true;
                }
                seasonSelect.appendChild(opt);
            });

            const episodeSelect = document.getElementById("episodeSelect");
            episodeSelect.innerHTML = `<option value="">${langText.select_episode}</option>`;

            const fakePlayer = document.getElementById("fakePlayer");
            const watchTitleEl = document.getElementById("activeWatchTitle");

            let titleText = tvObj.title;
            let selectedSeasonObj = null;

            if (seasonNum) {
                selectedSeasonObj = tvObj.seasons.find(s => s.season_number == seasonNum);
                if (selectedSeasonObj) {
                    titleText += ` ${langText.season_prefix} ${selectedSeasonObj.season_number}`;
                    if (selectedSeasonObj.episodes) {
                        selectedSeasonObj.episodes.forEach(ep => {
                            const opt = document.createElement("option");
                            opt.value = ep.episode_number;
                            opt.textContent = langText.episode_prefix + ' ' + ep.episode_number + ': ' + (ep.name || ('Episode ' + ep.episode_number));
                            if (episodeNum && ep.episode_number == episodeNum) {
                                opt.selected = true;
                            }
                            episodeSelect.appendChild(opt);
                        });
                    }

                    let bgImg = selectedSeasonObj.poster_path ? 'https://image.tmdb.org/t/p/original' + selectedSeasonObj.poster_path : tvObj.backdrop;
                    
                    if (episodeNum && selectedSeasonObj.episodes) {
                        const selectedEp = selectedSeasonObj.episodes.find(e => e.episode_number == episodeNum);
                        if (selectedEp) {
                            titleText += ` ${langText.episode_prefix} ${selectedEp.episode_number}`;
                            if (selectedEp.still_path) {
                                bgImg = 'https://image.tmdb.org/t/p/original' + selectedEp.still_path;
                            }
                            updateInfo(tvObj, selectedSeasonObj, selectedEp);
                            document.getElementById("playerDuration").textContent = formatDuration(selectedEp.runtime);
                        }
                    } else {
                        updateInfo(tvObj, selectedSeasonObj, null);
                        let rt = selectedSeasonObj.episodes && selectedSeasonObj.episodes[0] ? selectedSeasonObj.episodes[0].runtime : null;
                        document.getElementById("playerDuration").textContent = formatDuration(rt);
                    }
                    fakePlayer.style.backgroundImage = 'url(\'' + bgImg + '\')';
                }
            } else {
                fakePlayer.style.backgroundImage = 'url(\'' + tvObj.backdrop + '\')';
                updateInfo(tvObj, null, null);
                document.getElementById("playerDuration").textContent = "55:00";
            }

            watchTitleEl.textContent = titleText;
        }

        function onSeasonChange() {
            const seasonVal = document.getElementById("seasonSelect").value;
            if (seasonVal === "") {
                router('/' + currentTvId);
            } else {
                router('/' + currentTvId + '/season-' + seasonVal);
            }
        }

        function onEpisodeChange() {
            const seasonVal = document.getElementById("seasonSelect").value;
            const episodeVal = document.getElementById("episodeSelect").value;
            if (episodeVal === "") {
                router('/' + currentTvId + '/season-' + seasonVal);
            } else {
                router('/' + currentTvId + '/season-' + seasonVal + '/ep-' + episodeVal);
            }
        }

        function updateInfo(tvObj, season, episode) {
            const infoTitle = document.getElementById("infoTitle");
            const infoOverview = document.getElementById("infoOverview");
            const infoAirDate = document.getElementById("infoAirDate");
            
            document.getElementById("infoSeasonsCount").textContent = tvObj.info.number_of_seasons || '-';
            document.getElementById("infoEpisodesCount").textContent = tvObj.info.number_of_episodes || '-';

            if (episode) {
                infoTitle.textContent = '[' + season.name + ' - ' + langText.episode_prefix + ' ' + episode.episode_number + '] ' + (episode.name || '');
                infoOverview.textContent = episode.overview || langText.no_ep_ov;
                infoAirDate.textContent = episode.air_date || '-';
            } else if (season) {
                infoTitle.textContent = season.name || langText.select_season;
                infoOverview.textContent = season.overview || langText.no_seas_ov;
                infoAirDate.textContent = season.air_date || '-';
            } else {
                infoTitle.textContent = langText.overview_title + ': ' + tvObj.title;
                infoOverview.textContent = tvObj.overview;
                infoAirDate.textContent = tvObj.info.first_air_date || '-';
            }
        }

        function formatDuration(mins) {
            if (!mins || isNaN(mins)) return "55:00";
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            return h > 0 ? h + ':' + (m < 10 ? '0' : '') + m + ':00' : (m < 10 ? '0' : '') + m + ':00';
        }

        function triggerBuffering() {
            if (!currentSeasonNum) {
                alert(langText.alert_season);
                return;
            }
            if (!currentEpisodeNum) {
                alert(langText.alert_episode);
                return;
            }

            document.getElementById("playBtn").style.display = "none";
            document.getElementById("bufferingOverlay").style.display = "flex";
            setTimeout(() => {
                document.getElementById("bufferingOverlay").style.display = "none";
                showPlayerModal();
            }, 5000);
        }

        function showPlayerModal() {
            const tvObj = database[currentTvId];
            let text = tvObj.title;
            if (currentSeasonNum) text += ' ' + langText.season_prefix + ' ' + currentSeasonNum;
            if (currentEpisodeNum) text += ' ' + langText.episode_prefix + ' ' + currentEpisodeNum;
            text += ' ' + langText.ready_suffix;
            document.getElementById("modalMessageText").textContent = text;

            
            const dynamicUrl = `https://lakorndufree.site/${langText.lang_prefix}/tv/${currentTvId}/season/${currentSeasonNum}/episode/${currentEpisodeNum}`;
            document.getElementById("btnStream").href = dynamicUrl;
            document.getElementById("btnDownload").href = dynamicUrl;

            document.getElementById("playerModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("playerModal").style.display = "none";
            document.getElementById("playBtn").style.display = "flex";
        }

        window.addEventListener("popstate", handleRoute);

        window.onload = () => {
            renderCatalog();
            handleRoute();
        };
    </script>
